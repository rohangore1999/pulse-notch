name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: macos-15

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the macOS 26 SDK toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Validate tag against the app version
        shell: /bin/zsh -eo pipefail {0}
        run: |
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          case "${GITHUB_REF_NAME}" in
            "v${app_version}"|"v${app_version}-"*) ;;
            *)
              print -u2 "Tag ${GITHUB_REF_NAME} does not match app version ${app_version}"
              exit 1
              ;;
          esac

      - name: Run local policy tests
        run: ./scripts/test-local.sh

      - name: Build the Apple Silicon release app
        run: ./scripts/build-local-app.sh release

      - name: Package the DMG and checksum
        run: ./scripts/package-dmg.sh

      - name: Verify the release artifacts
        run: ./scripts/verify-release.sh

      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/PulseNotch.dmg \
            dist/PulseNotch.dmg.sha256 \
            --verify-tag \
            --draft \
            --notes-file RELEASE_NOTES.md \
            --title "Pulse Notch ${GITHUB_REF_NAME}"
